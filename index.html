<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff1bf">
<title>Games Lemang Pecahan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Konsep: dunia permainan kampung lemang. Latar sinar kuning, pita bambu, tombol tebal bergaya 3D.
   Satu tampilan terang yang sengaja dipilih; semua warna diberi token eksplisit. */
:root{
  --bambu:#5f7a2a; --bambu-tua:#3a4d16; --bambu-muda:#b7c46e;
  --ketan:#fff4d6; --santan:#fffbf0; --pasir:#efe3bf; --garis:#cdb97a;
  --api:#ff6b35; --api-tua:#c2461b; --kunyit:#ffc233; --kunyit-tua:#c58f00;
  --laut:#1f9d8f; --laut-tua:#136c62; --mawar:#e0457b; --mawar-tua:#a52a57;
  --tinta:#3b2a1a; --tinta-lembut:#7a5c3e; --langit:#fff1bf;
  --font-judul:'Baloo 2','Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;
  --font-isi:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--langit);color:var(--tinta);font-family:var(--font-isi);font-weight:700;font-size:17px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background-image:repeating-conic-gradient(from 0deg at 50% -8%,#fff1bf 0 7.5deg,#ffe8a0 7.5deg 15deg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--laut);outline-offset:3px;border-radius:12px}
#app{max-width:820px;margin:0 auto;padding-block:14px 24px;min-height:100vh}
.bambu-bawah{position:fixed;left:0;right:0;bottom:0;height:calc(28px + env(safe-area-inset-bottom,0px));z-index:3;pointer-events:none;
  background:linear-gradient(var(--bambu-muda) 0 22%,var(--bambu) 22%);border-top:3px solid var(--bambu-tua)}
.bambu-bawah::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 8px),var(--bambu-tua) calc(12.5% - 8px) 12.5%)}
h1,h2,h3{font-family:var(--font-judul);margin:0;line-height:1.1;text-wrap:balance}
.masuk{animation:masuk .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes masuk{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes loncat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes goyang{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes denyut{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes muncul{0%{transform:scale(0) rotate(-40deg);opacity:0}70%{transform:scale(1.25) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes melayang{to{transform:translateY(-60px);opacity:0}}
@keyframes ambang{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-14px) rotate(calc(var(--r,0deg) + 6deg))}}
.goyang{animation:goyang .45s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* tombol */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;padding:12px 22px;min-height:52px;
  font-family:var(--font-judul);font-weight:800;font-size:1.15rem;letter-spacing:.01em;color:#fff;background:var(--api);
  box-shadow:0 6px 0 var(--api-tua),0 10px 18px rgba(80,40,10,.22);transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--api-tua)}
.btn.hijau{background:var(--bambu);box-shadow:0 6px 0 var(--bambu-tua),0 10px 18px rgba(40,60,10,.25)}
.btn.hijau:active{box-shadow:0 1px 0 var(--bambu-tua)}
.btn.laut{background:var(--laut);box-shadow:0 6px 0 var(--laut-tua),0 10px 18px rgba(10,70,60,.25)}
.btn.laut:active{box-shadow:0 1px 0 var(--laut-tua)}
.btn.ghost{background:var(--santan);color:var(--tinta);text-shadow:none;box-shadow:0 5px 0 var(--garis),0 8px 14px rgba(80,50,10,.15)}
.btn.ghost:active{box-shadow:0 1px 0 var(--garis)}
.btn.kecil{min-height:42px;padding:8px 16px;font-size:1rem;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ikon-btn{width:46px;height:46px;border-radius:14px;border:3px solid var(--garis);background:var(--santan);display:grid;place-items:center;box-shadow:0 4px 0 var(--garis);flex:none}
.ikon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--garis)}
.ikon-btn svg{width:24px;height:24px}
.kartu{background:var(--santan);border:4px solid var(--garis);border-radius:26px;box-shadow:0 8px 0 var(--garis),0 14px 24px rgba(80,50,10,.14);padding:18px}

/* pecahan bertumpuk */
.frac{display:inline-grid;justify-items:center;line-height:1;font-family:var(--font-judul);font-weight:800}
.frac b{font-weight:800;padding:0 .12em}
.frac i{display:block;height:.1em;min-height:3px;width:100%;background:currentColor;border-radius:2px;margin:.12em 0}

/* batang lemang */
.bar{display:block;width:100%;height:auto;overflow:visible}
.bar .sl rect.dasar{fill:var(--pasir);stroke:var(--garis);stroke-width:3}
.bar .sl.on rect.dasar{fill:var(--bambu);stroke:var(--bambu-tua)}
.bar .sl rect.kilap{fill:var(--bambu-muda);opacity:0}
.bar .sl.on rect.kilap{opacity:.85}
.bar .sl ellipse{fill:var(--ketan);opacity:0}
.bar .sl.on ellipse{opacity:1}
.bar.tap .sl{cursor:pointer}
.bar.tap .sl:hover rect.dasar{stroke:var(--api)}
.bar.tap .sl.on:hover rect.dasar{stroke:var(--tinta)}
.bar.tap .sl:active{transform:scale(.96);transform-box:fill-box;transform-origin:center}

/* ========= beranda ========= */
.beranda{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:max(10px,env(safe-area-inset-top,0px));position:relative}
.spanduk{position:relative;background:var(--api);color:#fff;border:5px solid var(--bambu-tua);border-radius:30px;padding:14px 30px 18px;box-shadow:0 8px 0 var(--api-tua),0 18px 28px rgba(80,40,10,.25);margin-top:10px;max-width:100%}
.spanduk::before,.spanduk::after{content:"";position:absolute;top:18px;width:44px;height:64px;background:var(--bambu-tua);z-index:-1}
.spanduk::before{left:-34px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,28% 50%)}
.spanduk::after{right:-34px;clip-path:polygon(0 0,100% 0,72% 50%,100% 100%,0 100%)}
.spanduk .kecil{font-family:var(--font-judul);font-size:clamp(1rem,3.4vw,1.25rem);letter-spacing:.14em;text-transform:uppercase;color:#ffe3a8}
.spanduk h1{font-size:clamp(2.1rem,9vw,3.6rem);text-shadow:0 4px 0 rgba(120,40,10,.55)}
.maskot-besar{width:min(60vw,250px);animation:loncat 2.4s ease-in-out infinite;filter:drop-shadow(0 12px 10px rgba(60,40,10,.25))}
.gelembung{position:absolute;width:clamp(54px,12vw,84px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;border:4px solid #fff;
  box-shadow:0 6px 0 rgba(60,40,10,.18);font-size:clamp(1rem,3vw,1.5rem);animation:ambang 4s ease-in-out infinite;z-index:0}
.gelembung .frac{font-size:inherit}
.isian{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;z-index:1}
.isian label{font-family:var(--font-judul);font-size:1.2rem;text-align:left}
.isian input{width:100%;font:inherit;font-size:1.25rem;font-weight:800;padding:14px 18px;border-radius:18px;border:4px solid var(--garis);background:var(--santan);color:var(--tinta);min-height:56px}
.isian input::placeholder{color:#b09870}
.tautan.tim{color:#1565c0;font-weight:800;text-decoration:underline}
.tautan{background:none;border:0;color:var(--tinta-lembut);text-decoration:underline;font-weight:700;padding:6px;font-size:.95rem}
.salam{font-family:var(--font-judul);font-size:1.35rem}

/* ========= peta ========= */
.atas-peta{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.atas-peta .maskot{width:76px}
.atas-peta h2{font-size:clamp(1.3rem,5vw,1.8rem)}
.pangkat{display:inline-block;background:var(--kunyit);color:var(--tinta);border-radius:999px;padding:2px 12px;font-family:var(--font-judul);font-size:.95rem;border:3px solid var(--kunyit-tua)}
.xp{margin-top:8px;height:16px;border-radius:999px;background:var(--pasir);border:3px solid var(--garis);overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--laut),#47d1bf);border-radius:999px;transition:width .8s}
.xp-teks{font-size:.82rem;color:var(--tinta-lembut);margin-top:4px}
.jalur{display:flex;flex-direction:column;gap:20px;margin:26px 0 8px;position:relative}
.jalur::before{content:"";position:absolute;left:50%;top:20px;bottom:20px;width:10px;transform:translateX(-50%);background:repeating-linear-gradient(var(--garis) 0 14px,transparent 14px 26px);border-radius:6px;z-index:0}
.level{position:relative;z-index:1;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-align:left;width:min(100%,560px);padding:14px 16px;border:4px solid var(--garis);border-radius:24px;background:var(--santan);
  box-shadow:0 7px 0 var(--garis),0 12px 20px rgba(80,50,10,.14);transition:transform .1s}
.level:nth-child(odd){align-self:flex-start}.level:nth-child(even){align-self:flex-end}
.level:active{transform:translateY(5px);box-shadow:0 2px 0 var(--garis)}
.level .no{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-judul);font-weight:800;font-size:1.9rem;color:#fff;background:var(--warna);border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.level h3{font-size:1.25rem}
.level p{margin:2px 0 6px;font-size:.92rem;color:var(--tinta-lembut);font-weight:700}
.bintang-baris{display:flex;gap:4px}
.bintang-baris svg{width:26px;height:26px}
.level.terkunci{background:#ece4cf;border-color:#cfc3a2;box-shadow:0 7px 0 #cfc3a2;color:#8a7a5a}
.level.terkunci .no{background:#b9ad8c}
.level.terkunci p{color:#8a7a5a}
.level.bos{border-color:var(--mawar);box-shadow:0 7px 0 var(--mawar-tua),0 12px 20px rgba(120,20,60,.18);background:linear-gradient(135deg,var(--santan),#ffe6ef)}
.level.bos.terkunci{background:#ece4cf;border-color:#cfc3a2;box-shadow:0 7px 0 #cfc3a2}
.lencana-judul{margin:28px 0 12px;font-size:1.5rem}
.lencana-rak{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.lencana{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 8px;border-radius:20px;background:var(--santan);border:3px solid var(--garis);min-width:0}
.lencana .medali{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-judul);font-weight:800;font-size:1.4rem;color:#fff;background:var(--w);border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.lencana.kosong .medali{background:#cfc6ad;color:#fff;box-shadow:none}
.lencana strong{font-family:var(--font-judul);font-size:.98rem;line-height:1.1}
.lencana small{font-size:.78rem;color:var(--tinta-lembut);font-weight:700;line-height:1.2}
.tautan.tim{color:#1565c0;font-weight:800}
.kaki{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;margin-top:26px;font-size:.92rem}
.kaki .tautan{font-size:.92rem}

/* ========= bermain ========= */
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.hud .judul{font-family:var(--font-judul);font-size:1.05rem;text-align:center;line-height:1.1}
.titik{display:flex;gap:5px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.titik i{width:14px;height:14px;border-radius:50%;background:var(--pasir);border:3px solid var(--garis)}
.titik i.ok{background:var(--bambu);border-color:var(--bambu-tua)}
.titik i.ok2{background:var(--kunyit);border-color:var(--kunyit-tua)}
.titik i.salah{background:var(--mawar);border-color:var(--mawar-tua)}
.titik i.kini{border-color:var(--api);background:#fff;transform:scale(1.25)}
.nyawa{display:flex;gap:2px}
.nyawa svg{width:28px;height:28px}
.nyawa svg.hilang path{fill:#d8cdb0}
.stat{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;gap:10px;min-height:38px}
.skor{font-family:var(--font-judul);font-size:1.3rem;position:relative}
.skor b{font-size:1.55rem;color:var(--api-tua)}
.skor .tambah{position:absolute;left:100%;top:-6px;margin-left:8px;color:var(--bambu);font-size:1.2rem;animation:melayang 1s forwards;white-space:nowrap}
.kombo{background:var(--mawar);color:#fff;border-radius:999px;padding:3px 14px;font-family:var(--font-judul);font-size:1.05rem;border:3px solid #fff;box-shadow:0 3px 0 var(--mawar-tua);animation:denyut .6s}
.waktu{height:12px;border-radius:999px;background:var(--pasir);border:3px solid var(--garis);overflow:hidden;position:relative}
.waktu i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--kunyit),var(--api));border-radius:999px}
.waktu-label{font-size:.78rem;color:var(--tinta-lembut);margin:3px 4px 0;text-align:right}
.soal{margin-top:12px;display:flex;flex-direction:column;gap:16px}
.tanya{font-family:var(--font-judul);font-size:clamp(1.25rem,4.8vw,1.7rem);text-align:center;line-height:1.15;text-wrap:balance}
.panggung{padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.panggung .bar-wadah{width:100%;max-width:560px}
.besar-frac{font-size:clamp(2.6rem,12vw,4.2rem);color:var(--api-tua)}
.opsi{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opsi button{min-height:96px;border-radius:22px;border:4px solid var(--garis);background:var(--santan);box-shadow:0 7px 0 var(--garis);font-size:clamp(1.8rem,7vw,2.6rem);color:var(--tinta);display:grid;place-items:center;transition:transform .08s}
.opsi button:hover{border-color:var(--api)}
.opsi button:active{transform:translateY(5px);box-shadow:0 2px 0 var(--garis)}
.opsi button.salah{background:#ffe0e6;border-color:var(--mawar);box-shadow:0 7px 0 var(--mawar-tua);opacity:.7;pointer-events:none}
.opsi button.benar{background:#dff5d0;border-color:var(--bambu);box-shadow:0 7px 0 var(--bambu-tua);animation:denyut .6s}
.opsi button[disabled]{pointer-events:none}
.banding{display:grid;gap:12px}
.banding .sisi{position:relative;margin-top:8px;padding-top:24px!important;display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;background:var(--santan);border:4px solid var(--garis)}
.banding .lencong{position:absolute;top:-14px;left:16px;color:#fff;border-radius:999px;padding:0 14px;font-family:var(--font-judul);font-size:1rem;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.banding .sisi.a .lencong{background:var(--api)}
.banding .sisi.b .lencong{background:var(--laut)}
.banding .sisi.a{border-color:var(--api)}
.banding .sisi.b{border-color:var(--laut)}
.banding .sisi .frac{font-size:2.4rem;color:var(--api-tua)}
.tanda{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tanda button{min-height:84px;border-radius:22px;border:4px solid var(--garis);background:var(--santan);box-shadow:0 7px 0 var(--garis);font-family:var(--font-judul);font-weight:800;font-size:2.8rem;color:var(--tinta);line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.tanda button small{font-family:var(--font-isi);font-size:.8rem;line-height:1.1;text-align:center;font-weight:800;color:var(--tinta-lembut)}
.tanda button:active{transform:translateY(5px);box-shadow:0 2px 0 var(--garis)}
.tanda button.salah{background:#ffe0e6;border-color:var(--mawar);box-shadow:0 7px 0 var(--mawar-tua);opacity:.7;pointer-events:none}
.tanda button.benar{background:#dff5d0;border-color:var(--bambu);box-shadow:0 7px 0 var(--bambu-tua);animation:denyut .6s}
.slot-baris{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{min-height:120px;padding-top:22px!important;border-radius:20px;border:4px dashed var(--garis);background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 6px;position:relative;min-width:0}
.slot .no{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--laut);color:#fff;border-radius:999px;font-family:var(--font-judul);font-size:.9rem;padding:0 12px;border:3px solid #fff;white-space:nowrap}
.slot.terisi{border-style:solid;border-color:var(--laut);background:#e6f8f4}
.slot.benar{border-color:var(--bambu);background:#e3f5d6}
.kartu-urut{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:18px;border:4px solid var(--garis);background:var(--santan);box-shadow:0 6px 0 var(--garis);padding:10px 8px;min-width:0;width:100%;color:var(--tinta)}
.kartu-urut .frac{font-size:2rem;color:var(--api-tua)}
.kartu-urut .bar-wadah{width:100%}
.kartu-urut:active{transform:translateY(4px);box-shadow:0 2px 0 var(--garis)}
.tray .kartu-urut[disabled]{visibility:hidden}
.slot .kartu-urut[disabled]{visibility:visible;opacity:1}
.slot .kartu-urut{box-shadow:none;border-width:0;background:transparent;padding:0}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}
.tray .bungkus{min-height:140px;border-radius:20px;background:rgba(255,255,255,.35);min-width:0}
.aksi-baris{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hitung{font-family:var(--font-judul);font-size:1.15rem;text-align:center;color:var(--tinta-lembut)}
.hitung b{color:var(--api-tua);font-size:1.4rem}
.umpan{position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:6;padding:0 max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.umpan .kotak{pointer-events:auto;max-width:820px;margin:0 auto;border-radius:26px 26px 0 0;border:5px solid var(--bambu-tua);border-bottom:0;padding:14px 18px 18px;display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center;
  animation:masuk .35s both;box-shadow:0 -10px 30px rgba(60,40,10,.25)}
.umpan.baik .kotak{background:#e3f5d6}
.umpan.hint .kotak{background:#fff0c2;border-color:var(--kunyit-tua)}
.umpan.buruk .kotak{background:#ffe4ea;border-color:var(--mawar-tua)}
.umpan h3{font-size:1.5rem}
.umpan p{margin:2px 0 10px;font-size:1rem;font-weight:700}
.umpan .maskot{width:78px}
.umpan .btn{width:100%}
.ruang-umpan{height:200px}

/* ========= hasil ========= */
.hasil{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:max(8px,env(safe-area-inset-top,0px))}
.hasil .maskot{width:150px;animation:loncat 2s ease-in-out infinite}
.hasil h2{font-size:clamp(1.7rem,7vw,2.5rem)}
.bintang-besar{display:flex;gap:8px;justify-content:center}
.bintang-besar svg{width:76px;height:76px;filter:drop-shadow(0 6px 0 rgba(120,80,0,.25))}
.bintang-besar svg.mati path{fill:#d8cdb0}
.bintang-besar svg.nyala{animation:muncul .6s both}
.angka{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.angka div{background:var(--santan);border:3px solid var(--garis);border-radius:18px;padding:10px 6px;min-width:0}
.angka b{display:block;font-family:var(--font-judul);font-size:1.8rem;color:var(--api-tua);line-height:1.1}
.angka small{font-size:.82rem;color:var(--tinta-lembut);font-weight:800}
.baru{width:100%;display:flex;flex-direction:column;gap:8px}
.baru .lencana{flex-direction:row;text-align:left;gap:12px;padding:10px 14px;border-color:var(--kunyit-tua);background:#fff6d1;animation:muncul .6s both}
.hasil .aksi{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
.bagikan{width:100%;display:flex;flex-direction:column;gap:10px;align-items:center}
.bagikan textarea{width:100%;min-height:150px;border-radius:16px;border:3px solid var(--garis);background:var(--santan);font:inherit;font-size:.9rem;padding:10px;color:var(--tinta);resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--tinta);color:#fff;border-radius:999px;padding:10px 20px;font-weight:800;max-width:calc(100vw - 32px);text-align:center;animation:masuk .3s both}
.modal{position:fixed;inset:0;z-index:30;background:rgba(40,25,10,.6);display:grid;place-items:center;padding:20px}
.modal .kartu{max-width:440px;width:100%;position:relative}
.modal h3{margin-bottom:10px;font-size:1.5rem}
.modal p{margin:6px 0;font-weight:700}
.modal a{color:var(--laut-tua)}
#konfeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:700px){
  body{font-size:18px}
  .opsi button{min-height:116px}
  .ruang-umpan{height:170px}
}
@media (max-width:380px){
  .spanduk::before,.spanduk::after{display:none}
  .level{grid-template-columns:52px 1fr;padding:12px}
  .level .no{width:52px;height:52px;font-size:1.5rem}
  .atas-peta{grid-template-columns:auto 1fr}
  .atas-peta .ikon-btn{grid-column:2;justify-self:end;margin-top:-6px}
}

<script>
(function(){

/* ---------- alat kecil ---------- */
function $(s,r){return (r||document).querySelector(s);}

/* ---------- ikon ---------- */
var IKON={

  hati:function(hilang){return '<svg viewBox="0 0 24 24" class="'+(hilang?'hilang':'')+'" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#e0457b" stroke="#a52a57" stroke-width="1.4" stroke-linejoin="round"/></svg>';},
  suara:function(bisu){return bisu?'<svg viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';},

};

/* ---------- maskot: Si Lemang ---------- */
function maskot(mood,cls){
  var mulut={

  }[mood]||'';
  var mata=(mood==='sedih')?'<path d="M40 56q6-6 12 0M68 56q6-6 12 0" fill="none" stroke="#3b2a1a" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="46" cy="60" rx="5" ry="6" fill="#fff" stroke="#3b2a1a" stroke-width="2.5"/><ellipse cx="74" cy="60" rx="5" ry="6" fill="#fff" stroke="#3b2a1a" stroke-width="2.5"/><circle cx="46" cy="62" r="3" fill="#3b2a1a"/><circle cx="74" cy="62" r="3" fill="#3b2a1a"/>'
    :(mood==='bangga')?'<path d="M39 60q7-9 14 0M67 60q7-9 14 0" fill="none" stroke="#3b2a1a" stroke-width="4" stroke-linecap="round"/>'

  return '<svg class="'+(cls||'maskot')+'" viewBox="0 0 120 130" aria-hidden="true">'+

    tangan+

    '<rect x="28" y="40" width="64" height="7" fill="#3a4d16" opacity=".55"/><rect x="28" y="98" width="64" height="7" fill="#3a4d16" opacity=".55"/>'+

    '<ellipse cx="36" cy="72" rx="7" ry="5" fill="#ff8aa0" opacity=".7"/><ellipse cx="84" cy="72" rx="7" ry="5" fill="#ff8aa0" opacity=".7"/>'+

/* ---------- batang lemang (SVG) ---------- */
function bar(n,k,opt){
  opt=opt||{};
  var W=320,H=opt.h||66,pad=4,g=n>9?2:4,sw=(W-2*pad-g*(n-1))/n,r=Math.min(14,sw/2.6),s='';
  s+='<svg class="bar'+(opt.tap?' tap':'')+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Lemang dengan '+n+' potongan, '+(opt.sel?opt.sel.length:k)+' menyala">';
  for(var i=0;i<n;i++){
    var x=pad+i*(sw+g),on=opt.sel?opt.sel.indexOf(i)>=0:i<k;
    s+='<g class="sl '+(on?'on':'off')+'" data-i="'+i+'"'+(opt.tap?' data-act="potong" tabindex="0" role="button" aria-label="Potongan '+(i+1)+(on?' menyala':' mati')+'"':'')+'>'+
      '<rect class="dasar" x="'+x.toFixed(1)+'" y="4" width="'+sw.toFixed(1)+'" height="'+(H-8)+'" rx="'+r.toFixed(1)+'"/>'+
      '<rect class="kilap" x="'+(x+sw*0.14).toFixed(1)+'" y="'+(H*0.14).toFixed(1)+'" width="'+(sw*0.72).toFixed(1)+'" height="'+(H*0.12).toFixed(1)+'" rx="'+(H*0.06).toFixed(1)+'"/>'+
      '<ellipse cx="'+(x+sw/2).toFixed(1)+'" cy="'+(H*0.56).toFixed(1)+'" rx="'+Math.min(sw*0.2,11).toFixed(1)+'" ry="'+Math.min(sw*0.26,13).toFixed(1)+'"/></g>';
  }
  return s+'</svg>';
}

/* ---------- suara ---------- */
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}} return AC;}
function nada(f,t0,d,tipe,g){var a=ac();if(!a||S.bisu)return;try{var o=a.createOscillator(),v=a.createGain(),t=a.currentTime+t0;o.type=tipe||'triangle';o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g||.18,t+.02);v.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(v);v.connect(a.destination);o.start(t);o.stop(t+d+.05);}catch(e){}}
var SFX={
  klik:function(){nada(560,0,.07,'triangle',.12);},
  potong:function(){nada(420,0,.06,'square',.06);},
  benar:function(){[523,659,784].forEach(function(f,i){nada(f,i*.08,.2,'triangle',.2);});},
  kombo:function(){[659,784,988,1318].forEach(function(f,i){nada(f,i*.07,.18,'triangle',.18);});},
  salah:function(){nada(220,0,.18,'sawtooth',.12);nada(165,.12,.25,'sawtooth',.12);},
  hint:function(){nada(392,0,.12,'sine',.16);nada(330,.1,.16,'sine',.16);},
  bintang:function(i){nada(660+i*140,0,.35,'triangle',.22);},
  menang:function(){[523,659,784,1047,784,1047,1319].forEach(function(f,i){nada(f,i*.11,.26,'triangle',.2);});},
  kalah:function(){[392,349,311,262].forEach(function(f,i){nada(f,i*.18,.3,'sine',.18);});}
};
function bunyi(n,a){if(SFX[n])SFX[n](a);}

/* ---------- konfeti ---------- */
var kanvas=$('#konfeti'),cx=kanvas.getContext('2d'),partikel=[],animKonfeti=0;
function ukuranKanvas(){kanvas.width=window.innerWidth;kanvas.height=window.innerHeight;}
window.addEventListener('resize',ukuranKanvas);ukuranKanvas();
function konfeti(x,y,n){
  if(KURANG_GERAK)return;
  var warna=['#ff6b35','#ffc233','#1f9d8f','#e0457b','#6a5acd','#5f7a2a','#fff'];
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=4+Math.random()*9;partikel.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,r:4+Math.random()*6,w:warna[rnd(0,warna.length-1)],rot:Math.random()*6,vr:(Math.random()-.5)*.4,umur:70+rnd(0,40),bulat:Math.random()<.4});}
  if(!animKonfeti)animKonfeti=requestAnimationFrame(langkahKonfeti);
}
function langkahKonfeti(){
  cx.clearRect(0,0,kanvas.width,kanvas.height);
  partikel=partikel.filter(function(p){return p.umur>0&&p.y<kanvas.height+30;});
  partikel.forEach(function(p){p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.umur--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.globalAlpha=Math.min(1,p.umur/25);cx.fillStyle=p.w;if(p.bulat){cx.beginPath();cx.arc(0,0,p.r*.6,0,7);cx.fill();}else{cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);}cx.restore();});
  if(partikel.length)animKonfeti=requestAnimationFrame(langkahKonfeti);else{animKonfeti=0;cx.clearRect(0,0,kanvas.width,kanvas.height);}
}
function hujanKonfeti(){var w=window.innerWidth;konfeti(w*.2,window.innerHeight*.35,70);konfeti(w*.8,window.innerHeight*.35,70);setTimeout(function(){konfeti(w*.5,window.innerHeight*.25,90);},250);}

/* ---------- pembuat soal ---------- */
function pecahanAcak(maxD){var d=rnd(2,maxD),n=rnd(1,d-1);return {n:n,d:d};}
function qBaca(maxD){
  var f=pecahanAcak(maxD),n=f.n,d=f.d,k={},calon=[{n:d-n,d:d},{n:n,d:d+1},{n:Math.min(d-1,n+1),d:d},{n:Math.max(1,n-1),d:d},{n:d,d:n},{n:n,d:Math.max(2,d-1)}],ops=[f];
  k[fstr(f)]=1;
  acak(calon).forEach(function(c){if(ops.length<4&&c.n>=1&&c.d>=2&&!k[fstr(c)]&&bandingNilai(c,f)!==0){k[fstr(c)]=1;ops.push(c);}});
  var guard=0;while(ops.length<4&&guard++<40){var c2=pecahanAcak(maxD+1);if(!k[fstr(c2)]&&bandingNilai(c2,f)!==0){k[fstr(c2)]=1;ops.push(c2);}}
  return {tipe:'baca',f:f,opsi:acak(ops)};
}
function qBangun(maxD){return {tipe:'bangun',f:pecahanAcak(maxD)};}
function qBanding(jenis){
  var a,b;
  if(jenis==='sd'){var d=rnd(3,10),n1=rnd(1,d-1),n2=rnd(1,d-1);while(n2===n1)n2=rnd(1,d-1);a={n:n1,d:d};b={n:n2,d:d};}
  else if(jenis==='sp'){var n=rnd(1,5),d1=rnd(n+1,9),d2=rnd(n+1,10);while(d2===d1)d2=rnd(n+1,10);a={n:n,d:d1};b={n:n,d:d2};}
  else if(jenis==='sama'){var base=pick([{n:1,d:2},{n:1,d:3},{n:2,d:3},{n:3,d:4},{n:1,d:4},{n:2,d:5}]),m=rnd(2,3);a={n:base.n,d:base.d};b={n:base.n*m,d:base.d*m};}
  else{var d3=rnd(2,8),e3=rnd(2,8),n3=rnd(1,d3-1),m3=rnd(1,e3-1);var tries=0;while((d3===e3||n3*e3===m3*d3)&&tries++<30){e3=rnd(2,8);m3=rnd(1,e3-1);}a={n:n3,d:d3};b={n:m3,d:e3};}
  if(Math.random()<.5){var t=a;a=b;b=t;}
  var c=bandingNilai(a,b);
  return {tipe:'banding',jenis:jenis,a:a,b:b,jawab:c<0?'<':c>0?'>':'='};
}
function qUrut(jenis){
  var it=[],i;
  if(jenis==='sp'){var n=rnd(1,4),ds=[];while(ds.length<3){var d=rnd(n+1,10);if(ds.indexOf(d)<0)ds.push(d);}it=ds.map(function(d){return {n:n,d:d};});}
  else{var D=rnd(6,12),ns=[];while(ns.length<3){var x=rnd(1,D-1);if(ns.indexOf(x)<0)ns.push(x);}it=ns.map(function(x){return {n:x,d:D};});}
  var arah=Math.random()<.65?'naik':'turun',idx=[0,1,2];
  idx.sort(function(p,q){var c=bandingNilai(it[p],it[q]);return arah==='naik'?c:-c;});
  var tampil=acak([0,1,2]);
  /* hindari urutan tampil yang sudah benar */
  var guard=0;while(guard++<10&&tampil.every(function(v,p){return v===idx[p];}))tampil=acak([0,1,2]);
  var items=tampil.map(function(v){return it[v];});
  var benar=idx.map(function(v){return tampil.indexOf(v);});
  return {tipe:'urut',jenis:jenis,items:items,arah:arah,benar:benar};
}
function buatSoal(id){
  var q=[],i;
  if(id===1){for(i=0;i<5;i++)q.push(qBaca(i<3?6:8));for(i=0;i<3;i++)q.push(qBangun(i<2?6:8));q=acak(q);}
  else if(id===2){q=[qBanding('sd'),qBanding('sd'),qBanding('sd'),qBanding('sp'),qBanding('sp'),qBanding('sp'),qBanding('sama'),qBanding('beda')];q=acak(q);}
  else if(id===3){for(i=0;i<6;i++)q.push(qUrut('sp'));}
  else if(id===4){for(i=0;i<6;i++)q.push(qUrut('sd'));}
  else{q=[qBaca(9),qBaca(10),qBangun(9),qBanding('sd'),qBanding('sp'),qBanding('beda'),qUrut('sp'),qUrut('sp'),qUrut('sd'),qUrut('sd')];q=acak(q);}
  return q;
}

/* ---------- status permainan ---------- */
var layar='home',G=null,pewaktu=0,hasilAkhir=null;

function pangkatDari(xp){var p=PANGKAT[0];PANGKAT.forEach(function(r){if(xp>=r.xp)p=r;});return p;}
function pangkatBerikut(xp){for(var i=0;i<PANGKAT.length;i++){if(xp<PANGKAT[i].xp)return PANGKAT[i];}return null;}
function totalBintang(){return S.bintang.reduce(function(a,b){return a+b;},0);}
function terbuka(id){return id===1||S.bintang[id-2]>=1;}

/* ---------- toast ---------- */
function toast(t){var l=$('#lapis');var el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;l.appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},2200);}

/* ---------- layar: beranda ---------- */

    '<div class="xp-teks">'+S.xp+' poin'+(nx?' · '+(nx.xp-S.xp)+' lagi jadi '+nx.n:' · pangkat tertinggi!')+'</div></div>'+
    '<button class="ikon-btn" data-act="suara" aria-label="'+(S.bisu?'Nyalakan suara':'Matikan suara')+'">'+IKON.suara(S.bisu)+'</button></div>';
  h+='<div class="jalur" role="list">';

      '<div class="no">'+(buka?(L.id===5?'♛':L.id):IKON.kunci)+'</div>'+
      '<div style="min-width:0"><h3>'+L.nama+'</h3><p>'+(buka?L.desk:'Raih minimal 1 bintang di level sebelumnya')+'</p>'+
      '<div class="bintang-baris">'+IKON.bintang(b>=1)+IKON.bintang(b>=2)+IKON.bintang(b>=3)+'</div></div></button>';
  });
  h+='</div><h2 class="lencana-judul">Lencana Kamu</h2><div class="lencana-rak">';
  LENCANA.forEach(function(l){var dapat=S.lencana.indexOf(l.id)>=0;
    h+='<div class="lencana'+(dapat?'':' kosong')+'" style="--w:'+l.w+'"><div class="medali">'+(dapat?l.g:'?')+'</div><strong>'+l.nama+'</strong><small>'+l.tip+'</small></div>';});
  h+='</div><div class="kaki"><button class="tautan tim" data-act="pengembang">Tim pengembang</button><button class="tautan" data-act="bukanAku">Ganti pemain</button></div></section>';
  $('#app').innerHTML=h;window.scrollTo(0,0);
}

/* ---------- layar: bermain ---------- */
function mulaiLevel(id){
  var L=LEVELS[id-1];
  G={lv:L,qs:buatSoal(id),i:0,nyawa:3,skor:0,kombo:0,komboMax:0,tepat1:0,salah:0,jeda:false,sisa:WAKTU_SOAL};
  G.qs.forEach(function(q){q.hasil='';q.pilih=[];q.urut=[];q.percobaan=0;q.selesai=false;});

}
function nyawaHTML(){var s='';for(var i=0;i<3;i++)s+=IKON.hati(i>=G.nyawa);return s;}
function titikHTML(){return G.qs.map(function(q,i){var c=q.hasil||(i===G.i?'kini':'');return '<i class="'+c+'"></i>';}).join('');}

function tampilSoal(){
  var q=G.qs[G.i];G.q=q;window.__lg={get q(){return G&&G.q;},get g(){return G;}};
  tutupUmpan();G.sisa=WAKTU_SOAL;G.jeda=false;perbaruiHud();gambarSoal();mulaiWaktu();
}

  if(q.tipe==='baca'){
    h+='<div class="tanya">Pecahan apa yang ditunjukkan lemang ini?</div><div class="kartu panggung"><div class="bar-wadah">'+bar(q.f.d,q.f.n)+'</div></div><div class="opsi">';
    q.opsi.forEach(function(o){var s=q.salahPilih&&q.salahPilih.indexOf(fstr(o))>=0,b=q.selesai&&q.tampilBenar&&fstr(o)===fstr(q.f);
      h+='<button data-act="jawab" data-v="'+fstr(o)+'" class="'+(s?'salah':'')+(b?' benar':'')+'" aria-label="'+o.n+' per '+o.d+'"'+(q.selesai?' disabled':'')+'>'+fHTML(o)+'</button>';});
    h+='</div>';

      '<div class="sisi a"><span class="lencong">Atas</span><div class="frac-wadah">'+fHTML(q.a)+'</div><div class="bar-wadah">'+bar(q.a.d,q.a.n,{h:54})+'</div></div>'+
      '<div class="sisi b"><span class="lencong">Bawah</span><div class="frac-wadah">'+fHTML(q.b)+'</div><div class="bar-wadah">'+bar(q.b.d,q.b.n,{h:54})+'</div></div>'+
      '<div class="tanda">'+[['<','atas lebih kecil'],['=','sama besar'],['>','atas lebih besar']].map(function(t){var s=q.salahPilih&&q.salahPilih.indexOf(t[0])>=0,b=q.selesai&&q.tampilBenar&&t[0]===q.jawab;
        return '<button data-act="jawab" data-v="'+t[0]+'" class="'+(s?'salah':'')+(b?' benar':'')+'" aria-label="Pecahan atas '+q.a.n+' per '+q.a.d+', '+t[1]+' dari pecahan bawah '+q.b.n+' per '+q.b.d+'"'+(q.selesai?' disabled':'')+'>'+esc(t[0])+'<small>'+t[1]+'</small></button>';}).join('')+'</div></div>';
  }else{
    var naik=q.arah==='naik',kiri=naik?'terkecil':'terbesar',kanan=naik?'terbesar':'terkecil';
    h+='<div class="tanya">Urutkan dari yang <u>'+kiri+'</u> ke yang <u>'+kanan+'</u></div>';
    h+='<div class="slot-baris">';
    for(var p=0;p<3;p++){var idx=q.urut[p];var lab=p===0?kiri:p===2?kanan:'tengah';
      h+='<div class="slot'+(idx!==undefined?' terisi':'')+(q.selesai&&q.tampilBenar?' benar':'')+'"><span class="no">'+(p+1)+' · '+lab+'</span>'+
        (idx!==undefined?'<button class="kartu-urut" data-act="lepasUrut" data-p="'+p+'" aria-label="Pecahan '+q.items[idx].n+' per '+q.items[idx].d+', ketuk untuk melepas"'+(q.selesai?' disabled':'')+'>'+fHTML(q.items[idx])+'<div class="bar-wadah">'+bar(q.items[idx].d,q.items[idx].n,{h:40})+'</div></button>':'')+'</div>';}

function gambarSoal(){$('#soalWadah').innerHTML=soalHTML(G.q);}

/* ---------- waktu ---------- */
function mulaiWaktu(){
  stopWaktu();var bar=$('#waktuBar');if(bar)bar.style.width='100%';
  pewaktu=setInterval(function(){
    if(G.jeda)return;G.sisa=Math.max(0,G.sisa-.1);var b=$('#waktuBar');if(b)b.style.width=(G.sisa/WAKTU_SOAL*100)+'%';
  },100);
}
function stopWaktu(){if(pewaktu){clearInterval(pewaktu);pewaktu=0;}}

/* ---------- penilaian ---------- */
var PUJI=['Mantap!','Hebat!','Tepat sekali!','Keren!','Pintar sekali!','Luar biasa!'];
function petunjuk(q){
  if(q.tipe==='baca')return 'Hitung dulu semua potongan lemang (itu penyebut), lalu hitung potongan yang menyala (itu pembilang).';
  if(q.tipe==='bangun')return 'Angka bawah adalah jumlah seluruh potongan. Angka atas adalah berapa potongan yang harus menyala.';
  if(q.tipe==='banding'){
    if(q.jenis==='sd')return 'Potongannya sama besar. Lihat siapa yang punya lebih banyak potongan menyala.';
    if(q.jenis==='sp')return 'Jumlah potongan menyala sama. Makin banyak potongan lemang dibagi, makin kecil tiap potongannya.';
    return 'Bandingkan panjang bagian yang menyala pada kedua lemang. Samakan dulu ukuran potongannya kalau perlu.';
  }
  if(q.jenis==='sp')return 'Pembilangnya sama. Penyebut yang makin besar membuat potongan makin kecil.';
  return 'Penyebutnya sama, jadi potongannya sama besar. Urutkan dari jumlah potongan menyala.';
}
function penjelasan(q){
  if(q.tipe==='baca')return 'Lemang dibagi '+q.f.d+' potongan dan '+q.f.n+' yang menyala, jadi pecahannya '+q.f.n+'/'+q.f.d+'.';
  if(q.tipe==='bangun')return q.f.n+'/'+q.f.d+' berarti '+q.f.n+' potongan menyala dari '+q.f.d+' potongan seluruhnya.';
  if(q.tipe==='banding'){
    var kata=q.jawab==='<'?'lebih kecil dari':q.jawab==='>'?'lebih besar dari':'sama dengan';
    var s=fstr(q.a)+' '+kata+' '+fstr(q.b)+'. ';
    if(q.a.d===q.b.d)s+='Penyebutnya sama, jadi bandingkan pembilang '+q.a.n+' dan '+q.b.n+'.';
    else if(q.a.n===q.b.n)s+='Pembilangnya sama. Penyebut lebih besar berarti potongan lebih kecil.';
    else s+='Kali silang: '+q.a.n+'×'+q.b.d+'='+(q.a.n*q.b.d)+' dan '+q.b.n+'×'+q.a.d+'='+(q.b.n*q.a.d)+'.';
    return s;
  }
  return 'Urutan yang benar: '+q.benar.map(function(i){return fstr(q.items[i]);}).join(', ')+'.';
}
function cekBenar(q,v){
  if(q.tipe==='baca')return v===fstr(q.f);
  if(q.tipe==='banding')return v===q.jawab;
  if(q.tipe==='bangun')return q.pilih.length===q.f.n;
  return q.urut.length===3&&q.urut.every(function(x,p){return x===q.benar[p];});
}
function tambahSkor(n,apa){
  G.skor+=n;var el=$('#skor');if(el){el.textContent=G.skor;var t=document.createElement('span');t.className='tambah';t.textContent='+'+n;el.parentNode.appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},1000);}
}
function jawab(v){
  var q=G.q;if(!q||q.selesai)return;
  var ok=cekBenar(q,v);
  if(ok){
    var pertama=q.percobaan===0,poin=pertama?100:50;
    if(pertama){G.kombo++;G.tepat1++;if(G.kombo>G.komboMax)G.komboMax=G.kombo;poin+=Math.min(G.kombo,6)*10;poin+=Math.round(50*G.sisa/WAKTU_SOAL);}else{G.kombo=0;}
    q.selesai=true;q.hasil=pertama?'ok':'ok2';G.jeda=true;
    tambahSkor(poin);perbaruiHud();
    if(q.tipe==='baca'||q.tipe==='banding'){q.tampilBenar=true;}
    if(q.tipe==='urut')q.tampilBenar=true;
    gambarSoal();
    var kombo=G.kombo>=3&&pertama;bunyi(kombo?'kombo':'benar');
    var r=$('#soalWadah');var rc=r.getBoundingClientRect();konfeti(rc.left+rc.width/2,rc.top+80,kombo?60:30);
    var judul=kombo?'Kombo ×'+G.kombo+'!':pick(PUJI);
    umpan('baik',pertama?'senang':'senang',judul,pertama?('+'+poin+' poin. '+(kombo?'Terus begini, kamu sedang menyala!':'Jawabanmu benar.')):('Berhasil di percobaan kedua. +'+poin+' poin. Terus berlatih ya!'),G.i===G.qs.length-1?'Lihat Hasil':'Lanjut','lanjut');
  }else{
    q.percobaan++;G.kombo=0;
    if(q.tipe==='baca'||q.tipe==='banding'){q.salahPilih=(q.salahPilih||[]);q.salahPilih.push(v);}
    if(q.percobaan===1){
      bunyi('hint');G.jeda=true;gambarSoal();perbaruiHud();
      var el=$('#soalWadah');el.classList.remove('goyang');void el.offsetWidth;if(!KURANG_GERAK)el.classList.add('goyang');
      umpan('hint','mikir','Hampir! Coba sekali lagi',petunjuk(q),'Coba Lagi','tutupUmpan');
    }else{
      bunyi('salah');q.selesai=true;q.hasil='salah';G.nyawa--;G.salah++;G.jeda=true;
      if(q.tipe==='bangun'){q.pilih=[];for(var i=0;i<q.f.n;i++)q.pilih.push(i);}
      if(q.tipe==='urut')q.urut=q.benar.slice();
      q.tampilBenar=true;perbaruiHud();gambarSoal();
      var habis=G.nyawa<=0;
      umpan('buruk','sedih',habis?'Nyawamu habis':'Belum tepat',penjelasan(q)+(habis?' Tidak apa-apa, ayo coba lagi!':' Tenang, soal berikutnya pasti bisa.'),habis?'Lihat Hasil':(G.i===G.qs.length-1?'Lihat Hasil':'Lanjut'),'lanjut');
    }
  }
}
function umpan(jenis,mood,judul,teks,tombol,aksi){
  var u=$('#umpan');u.className='umpan '+jenis;u.hidden=false;$('#ruangUmpan').hidden=false;
  u.innerHTML='<div class="kotak">'+maskot(mood,'maskot')+'<div style="min-width:0"><h3>'+esc(judul)+'</h3><p>'+esc(teks)+'</p><button class="btn '+(jenis==='buruk'?'':jenis==='hint'?'laut':'hijau')+'" data-act="'+aksi+'" id="btnUmpan">'+esc(tombol)+'</button></div></div>';
  var b=$('#btnUmpan');if(b)setTimeout(function(){try{b.focus({preventScroll:true});}catch(e){}},50);
  setTimeout(function(){try{u.scrollIntoView({block:'nearest'});}catch(e){}},60);
}
function tutupUmpan(){var u=$('#umpan');if(u){u.hidden=true;u.innerHTML='';}var r=$('#ruangUmpan');if(r)r.hidden=true;if(G)G.jeda=false;}
function lanjut(){
  if(G.nyawa<=0||G.i>=G.qs.length-1){selesaiLevel(G.nyawa<=0);return;}
  G.i++;tampilSoal();
}

/* ---------- selesai level ---------- */
function selesaiLevel(kalah){
  stopWaktu();tutupUmpan();
  var total=G.qs.length,tepat=G.tepat1,acc=tepat/total;
  var bin=kalah?0:(acc>=.9?3:acc>=.7?2:acc>=.5?1:0);
  var id=G.lv.id,lama=S.bintang[id-1],xpGain=G.skor,pkLama=pangkatDari(S.xp).n;
  var baru=[];
  function beri(l){if(S.lencana.indexOf(l)<0){S.lencana.push(l);baru.push(l);}}
  S.xp+=xpGain;
  if(bin>lama)S.bintang[id-1]=bin;
  if(G.skor>S.skor[id-1])S.skor[id-1]=G.skor;
  if(bin>=1&&id===1)beri('pemula');
  if(bin===3)beri('bintang3');
  if(G.komboMax>=5)beri('kombo5');
  if(!kalah&&G.salah===0&&tepat===total)beri('sempurna');
  if(totalBintang()>=10)beri('kolektor');
  if(bin>=1&&id===5)beri('raja');
  simpan();
  hasilAkhir={kalah:kalah,bin:bin,skor:G.skor,tepat:tepat,total:total,komboMax:G.komboMax,id:id,xpGain:xpGain,baru:baru,pangkatBaru:pangkatDari(S.xp).n!==pkLama?pangkatDari(S.xp).n:'',lanjutBuka:bin>=1&&id<5};
  tampilHasil();
}
function teksHasil(){
  var h=hasilAkhir,L=LEVELS[h.id-1],bs='';for(var i=0;i<3;i++)bs+=i<h.bin?'★':'☆';
  return 'Games Lemang Pecahan\nNama: '+S.nama+'\nLevel '+h.id+' ('+L.nama+'): '+bs+(h.kalah?' (nyawa habis)':'')+'\nSkor: '+h.skor+'\nBenar di percobaan pertama: '+h.tepat+' dari '+h.total+'\nKombo terbaik: '+h.komboMax+'\nPangkat: '+pangkatDari(S.xp).n+' ('+S.xp+' poin)\nTotal bintang: '+totalBintang()+' dari 15\nTanggal: '+new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
}
function tampilHasil(){
  layar='hasil';var h=hasilAkhir,L=LEVELS[h.id-1];
  var judul=h.kalah?'Nyawa habis, tapi kamu sudah berusaha!':h.bin===3?'Luar biasa! Kamu jago pecahan!':h.bin===2?'Bagus sekali!':h.bin===1?'Berhasil lulus!':'Belum lulus, sedikit lagi!';
  var sub=h.kalah?'Salah itu bagian dari belajar. Coba lagi, kamu pasti lebih baik.':h.bin===3?'Semua jawabanmu hampir tanpa salah.':h.bin===2?'Sedikit lagi bisa dapat tiga bintang.':h.bin===1?'Ulangi lagi kalau mau dapat lebih banyak bintang.':'Kamu butuh minimal 1 bintang untuk membuka level berikutnya.';
  var s='<section class="hasil masuk" aria-labelledby="jh">'+maskot(h.bin>=2?'bangga':h.bin===1?'senang':'sedih','maskot')+
    '<div><h2 id="jh">'+judul+'</h2><p style="margin:6px 0 0">'+sub+'</p></div>'+
    '<div class="bintang-besar" id="bintangBesar" role="img" aria-label="'+h.bin+' dari 3 bintang">'+[0,1,2].map(function(i){return IKON.bintang(false,'mati');}).join('')+'</div>'+
    '<div class="angka"><div><b>'+h.skor+'</b><small>Skor</small></div><div><b>'+h.tepat+'/'+h.total+'</b><small>Benar pertama kali</small></div><div><b>×'+h.komboMax+'</b><small>Kombo terbaik</small></div></div>'+
    '<p style="margin:0">+'+h.xpGain+' poin pangkat'+(h.pangkatBaru?'. Selamat, kamu naik jadi <b>'+h.pangkatBaru+'</b>!':'.')+'</p>';
  if(h.baru.length){s+='<div class="baru"><h3>Lencana baru!</h3>'+h.baru.map(function(id){var l=LENCANA.filter(function(x){return x.id===id;})[0];return '<div class="lencana" style="--w:'+l.w+'"><div class="medali">'+l.g+'</div><div><strong>'+l.nama+'</strong><br><small>'+l.tip+'</small></div></div>';}).join('')+'</div>';}
  s+='<div class="aksi"><button class="btn" data-act="ulangLevel" data-id="'+h.id+'">Main Lagi</button>'+(h.lanjutBuka?'<button class="btn hijau" data-act="level" data-id="'+(h.id+1)+'">Level Berikutnya</button>':'')+'<button class="btn ghost" data-act="peta">Peta</button></div>'+
    '<div class="bagikan"><div class="aksi"><a class="btn laut kecil" id="tautWA" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(teksHasil())+'">Kirim lewat WhatsApp</a><button class="btn ghost kecil" data-act="salin">Salin hasil</button></div>'+
    '<small style="color:var(--tinta-lembut)">Di WhatsApp, pilih kontak gurumu lalu kirim.</small><textarea id="teksSalin" readonly aria-label="Teks hasil" hidden>'+esc(teksHasil())+'</textarea></div></section>';
  $('#app').innerHTML=s;window.scrollTo(0,0);
  /* animasi bintang */
  var wad=$('#bintangBesar'),i=0;
  function nyala(){if(i>=h.bin){if(h.bin>=1)setTimeout(function(){bunyi(h.bin===3?'menang':'benar');if(h.bin>=2)hujanKonfeti();},150);else bunyi('kalah');return;}
    var el=wad.children[i];el.outerHTML=IKON.bintang(true,'nyala');bunyi('bintang',i);i++;setTimeout(nyala,KURANG_GERAK?0:420);}
  setTimeout(nyala,400);
}

/* ---------- pengembang ---------- */
function bukaPengembang(){
  var l=$('#lapis');var m=document.createElement('div');m.className='modal';m.id='modalDev';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','Tim pengembang');
  m.innerHTML='<div class="kartu"><button class="ikon-btn" data-act="tutupModal" aria-label="Tutup" style="position:absolute;top:10px;right:10px">'+IKON.tutup+'</button><h3>Tim Pengembang</h3>'+
    '<ol style="margin:8px 0 10px;padding-left:1.3em;font-weight:800;line-height:1.7"><li>Risdianto Parahat</li><li>Muhammad Firman</li><li>Albertus Hary Usna</li><li>Erics</li></ol>'+
    '<p><b>Tahun:</b> 2026</p><p style="font-size:.9rem;color:var(--tinta-lembut)">Media latihan pecahan bergaya game untuk siswa sekolah dasar. Dibuat sebagai tugas kelompok.</p></div>';
  l.appendChild(m);var b=m.querySelector('button');if(b)b.focus();
}
function tutupModal(){var m=$('#modalDev');if(m&&m.parentNode)m.parentNode.removeChild(m);}
function bukaGanti(){
  var l=$('#lapis');var m=document.createElement('div');m.className='modal';m.id='modalDev';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
  m.innerHTML='<div class="kartu"><h3>Ganti pemain?</h3><p>Bintang, poin, dan lencana milik '+esc(S.nama)+' di perangkat ini akan dihapus.</p><div class="aksi-baris" style="margin-top:14px"><button class="btn ghost kecil" data-act="tutupModal">Batal</button><button class="btn kecil" data-act="gantiYa">Ya, ganti</button></div></div>';
  l.appendChild(m);
}

/* ---------- aksi (delegasi klik) ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act');
  if(a==='jawab'){ac();bunyi('klik');jawab(el.getAttribute('data-v'));}
  else if(a==='potong'){if(!G||!G.q||G.q.selesai)return;var i=+el.getAttribute('data-i'),p=G.q.pilih,k=p.indexOf(i);if(k>=0)p.splice(k,1);else p.push(i);bunyi('potong');gambarSoal();}
  else if(a==='ulangPotong'){G.q.pilih=[];gambarSoal();}
  else if(a==='pilihUrut'){if(G.q.selesai)return;var j=+el.getAttribute('data-i');if(G.q.urut.indexOf(j)<0&&G.q.urut.length<3){G.q.urut.push(j);bunyi('klik');gambarSoal();}}
  else if(a==='lepasUrut'){if(G.q.selesai)return;G.q.urut.splice(+el.getAttribute('data-p'),1);bunyi('klik');gambarSoal();}
  else if(a==='ulangUrut'){G.q.urut=[];gambarSoal();}
  else if(a==='periksa'){ac();jawab(null);}
  else if(a==='lanjut'){bunyi('klik');lanjut();}
  else if(a==='tutupUmpan'){bunyi('klik');tutupUmpan();}
  else if(a==='level'){ac();var id=+el.getAttribute('data-id');if(!terbuka(id)){bunyi('salah');el.classList.add('goyang');setTimeout(function(){el.classList.remove('goyang');},500);toast('Raih 1 bintang di level sebelumnya dulu ya.');return;}bunyi('klik');mulaiLevel(id);}
  else if(a==='ulangLevel'){bunyi('klik');mulaiLevel(+el.getAttribute('data-id'));}
  else if(a==='peta'||a==='keluar'){bunyi('klik');tampilPeta();}
  else if(a==='suara'){S.bisu=!S.bisu;simpan();if(!S.bisu)bunyi('klik');tampilPeta();}
  else if(a==='pengembang'){bukaPengembang();}
  else if(a==='tutupModal'){tutupModal();}
  else if(a==='bukanAku'){bukaGanti();}
  else if(a==='gantiYa'){tutupModal();hapusSimpan();tampilHome();}
  else if(a==='salin'){
    var t=teksHasil();var ta=$('#teksSalin');
    function cadangan(){if(ta){ta.hidden=false;ta.focus();ta.select();}toast('Tekan tahan teks lalu pilih Salin.');}
    try{navigator.clipboard.writeText(t).then(function(){toast('Hasil disalin. Tempel di WhatsApp.');},cadangan);}catch(err){cadangan();}
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')tutupModal();
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('data-act')==='potong'){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='formMulai')return;e.preventDefault();ac();
  var inp=$('#nama');if(inp){var v=inp.value.trim();if(!v){toast('Tulis namamu dulu ya.');inp.focus();return;}S.nama=v.slice(0,20);simpan();}
  bunyi('klik');tampilPeta();
});

/* ---------- mulai ---------- */
muat();tampilHome();
})();
</script>
